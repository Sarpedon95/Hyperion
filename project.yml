name: Hyperion
options:
  bundleIdPrefix: com.sarpedon
  deploymentTarget:
    iOS: "17.0"

targets:
  Hyperion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Hyperion
        excludes:
          - "**/.DS_Store"
          - "**/*.sh"
          - "**/*.md"
          - "**/*.diff"
          - "**/*.txt"
          - "**/*.yml"
          - "**/*.yaml"
          - "**/*.mobileprovision"
          - "**/*.provisionprofile"
          - "**/*.p8"
          - "**/*.p12"
          - "**/*.key"
          - "**/*.cer"
          - "**/*.csr"
          - "**/*.pem"
      - path: Assets.xcassets
    info:
      path: Hyperion/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Hyperion needs local network access to connect to your Lyrion Music Server.
        NSBluetoothAlwaysUsageDescription: Hyperion uses Bluetooth to detect connected headphones and automatically load matching EQ presets.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    entitlements:
      path: Hyperion/Hyperion.entitlements
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarpedon.hyperion
        PRODUCT_NAME: Hyperion
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "S55WHMKG3U"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Hyperion/Info.plist
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_TESTABILITY: NO
          VALIDATE_PRODUCT: YES
          SWIFT_COMPILATION_MODE: wholemodule
