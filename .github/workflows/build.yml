name: Deploy to TestFlight

"on":
  push:
    branches: [main]

jobs:
  deploy:
    # macos-26 ships Xcode 26 which includes the iOS 26 SDK.
    # Apple now requires the iOS 26 SDK for all App Store uploads.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set build number and generate Xcode project
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Setting build number to: $BUILD_NUMBER"
          # Write the patch script without a heredoc (heredocs inside YAML
          # run blocks cause syntax errors because the delimiter must be
          # unindented, which confuses the YAML parser).
          printf '%s\n' \
            'import re, sys' \
            'build = sys.argv[1]' \
            'content = open("project.yml").read()' \
            'content = re.sub(r"CURRENT_PROJECT_VERSION:.*", "CURRENT_PROJECT_VERSION: \"" + build + "\"", content)' \
            'open("project.yml", "w").write(content)' \
            > patch_version.py
          python3 patch_version.py "$BUILD_NUMBER"
          # Remove stale icon PNGs that are not referenced by Contents.json.
          # These show up as Xcode "unassigned children" and can survive local
          # copy/merge operations even when the current asset catalog is valid.
          python3 -c 'import json; from pathlib import Path; appicon=Path("Assets.xcassets/AppIcon.appiconset"); contents=appicon/"Contents.json"; data=json.loads(contents.read_text()) if contents.exists() else {"images": []}; keep={i["filename"] for i in data.get("images", []) if i.get("filename")}; [p.unlink() or print(f"Removed stale AppIcon file: {p.name}") for p in (appicon.iterdir() if appicon.is_dir() else []) if p.is_file() and p.name != "Contents.json" and p.name not in keep]'
          xcodegen generate --spec project.yml
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Hyperion/Info.plist
          echo "Final Info.plist CFBundleVersion:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Hyperion/Info.plist

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/hyperion.mobileprovision

      - name: Build & Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Hyperion.xcodeproj \
            -scheme Hyperion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath Hyperion.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Hyperion AppStore" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Patch and verify archived app bundle
        run: |
          chmod +x Hyperion/fix_hyperion_appstore_bundle.sh Hyperion/verify_ipa_before_upload.sh
          Hyperion/fix_hyperion_appstore_bundle.sh Hyperion.xcarchive

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sarpedon.hyperion</key>
              <string>Hyperion AppStore</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath Hyperion.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build

      - name: Verify exported IPA
        run: |
          IPA_PATH="$(find ./build -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -n "$IPA_PATH"
          Hyperion/verify_ipa_before_upload.sh "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          # Use xcrun altool with the App Store Connect API key.
          # Note: altool is deprecated in Xcode 15+ in favour of notarytool for
          # notarisation, but for iOS IPA *upload* to TestFlight it remains the
          # supported CLI path until Apple ships a dedicated xcrun uploadtool.
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
